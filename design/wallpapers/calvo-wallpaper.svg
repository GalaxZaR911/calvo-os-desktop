  <!-- Decoracion minimalista -->
  <circle cx="960" cy="455" r="225"
          fill="none" stroke="#202D3A"
          stroke-width="2"/>

  <!-- Calvito -->
  <g transform="translate(800 295) scale(2)">
    <circle cx="80" cy="80" r="67"
