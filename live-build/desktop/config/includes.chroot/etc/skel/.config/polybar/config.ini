; CaLvo.OS - Barra de control calva

[colors]
background = #101820
foreground = #F2F6FA
accent = #F4C95D
panel = #202D3A

[bar/calvo]
width = 100%
height = 30
background = ${colors.background}
foreground = ${colors.foreground}
font-0 = DejaVu Sans Mono:size=10
module-margin = 1

modules-left = distro workspaces
modules-right = cpu memory network volume battery date

[module/distro]
type = custom/text
format = " CaLvo.OS "
format-foreground = ${colors.background}
format-background = ${colors.accent}

[module/workspaces]
type = internal/i3
label-focused = %index%
label-focused-foreground = ${colors.background}
label-focused-background = ${colors.accent}
label-focused-padding = 2
label-unfocused = %index%
label-unfocused-padding = 2

[module/cpu]
type = internal/cpu
interval = 3
label = %{F#F4C95D}CPU%{F-} %percentage%%

[module/memory]
type = internal/memory
interval = 3
label = %{F#F4C95D}RAM%{F-} %percentage_used%%

[module/date]
type = internal/date
interval = 5
date = %d/%m/%Y
time = %H:%M
label = %date%  %time%
label-foreground = #56B4FF
label-padding = 2

[settings]
screenchange-reload = true

[module/network]
type = custom/script
exec = ~/.config/polybar/network-status.sh
interval = 5
label = %{F#56B4FF}%output%%{F-}

[module/volume]
type = custom/script
exec = ~/.config/polybar/volume-status.sh
interval = 2
label = %output%
click-left = wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
scroll-up = wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
scroll-down = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

[module/battery]
type = custom/script
exec = ~/.config/polybar/battery-status.sh
interval = 30
label = %{F#F4C95D}%output%%{F-}
