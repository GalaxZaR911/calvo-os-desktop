; ======================================
; CaLvo.OS - Barra superior
; ======================================

[colors]
background = #101820
foreground = #F2F6FA
accent = #56B4FF
panel = #202D3A

[bar/calvo]
width = 100%
height = 32
background = ${colors.background}
foreground = ${colors.foreground}

font-0 = monospace:size=10

modules-left = distro
modules-center = workspaces
modules-right = date

[module/distro]
type = custom/text
content = " CaLvo.OS "
content-foreground = ${colors.accent}

[module/workspaces]
type = internal/i3
label-focused = %index%
label-focused-foreground = ${colors.accent}
label-focused-padding = 2
label-unfocused = %index%
label-unfocused-padding = 2

[module/date]
type = internal/date
interval = 5
date = %d/%m/%Y%
time = %H:%M
label = %date%  %time%
label-padding = 2

[settings]
screenchange-reload = true
